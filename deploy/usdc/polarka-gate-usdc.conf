# A drop-in for polarka-gate.service, as /etc/systemd/system/polarka-gate.service.d/usdc.conf: the gate takes USDC
# on Base for stamps through the facilitator of polarka-usdc.service, and gives the proof of a SHA-256 already paid
# for without payment (--free-look; it needs a stamps service of 0.2.9 or later behind it, an older one answers 404
# and nothing is given free). PAY_TO comes from the facilitator's own file, so both name the same address; the gate
# checks the facilitator's /health at start (network, asset, payTo, limits) and offers USDC only when they agree.
# While the facilitator cannot be reached the gate offers NORTH alone and asks again every minute.
# Back: remove this file, systemctl daemon-reload, restart the gate.
[Unit]
After=polarka-usdc.service

[Service]
EnvironmentFile=/etc/polarka-usdc/env
ExecStart=
ExecStart=/opt/polarka-gate/venv/bin/polarka-agent --dir /var/lib/polarka-gate/wallet postage-serve --upstream 127.0.0.1:8680 --price-hashes 600 --calls 100 --free 20 --listen 127.0.0.1:8670 --trust-proxy --x402-facilitator http://127.0.0.1:9570 --route /v1/stamp=127.0.0.1:8681 --route /v1/mail=127.0.0.1:8682 --public-url https://gate.polarka.org --offers /etc/polarka-gate/offers.json --usdc-facilitator http://127.0.0.1:8402 --usdc-pay-to ${PAY_TO} --usdc-path /v1/stamp --free-look /v1/stamp
